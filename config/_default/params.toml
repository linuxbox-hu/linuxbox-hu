# boolean type, the global switch for TOC in posts.
toc = true
# the avatar on sidebar. Not a Hugo Pipes asset (lives under static/,
# not assets/), so this resolves via the template's absURL fallback -
# same value the Jekyll site's Chirpy config already uses.
avatar = "assets/img/logos/linuxbox-logo-new-dark-512.png"
author = "kecsi"

[assets]
  self_host = false

# Empty on purpose (no analytics configured) - the theme's head.html
# ranges over this table unconditionally in production builds, so it
# needs to exist even when empty.
[analytics]

[social]
  name = "kecsi"
  url = "https://github.com/linuxbox-hu"

[[social.links]]
  type = "github"
  id = "linuxbox-hu"
  icon = "fab fa-github"

[[social.links]]
  type = "custom"
  id = "javascript:location.href = 'mailto:' + ['kecsi','linuxbox.hu'].join('@')"
  icon = "fas fa-envelope"

[[social.links]]
  type = "rss"
  icon = "fas fa-rss"
  noblank = true

[comments]
# Off - matches the old config, where every comment backend (LeanCloud,
# Facebook, Telegram) was already disabled or unconfigured.
enable = false
provider = ""
